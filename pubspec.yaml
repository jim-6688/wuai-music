name: wuaimusic
description: 吾爱Music - 精致的液态玻璃风格音乐播放器
publish_to: 'none'
version: 2.2.6+2018

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Audio
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  just_audio_background: ^0.0.1-beta.11

  # Navigation
  go_router: ^13.0.0

  # DI
  get_it: ^7.6.7

  # File & Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  # File Picker
  file_picker: ^8.0.0
  permission_handler: ^11.1.0
  # Audio Query（MediaStore 原生查询）
  on_audio_query: ^2.9.0

  # NAS
  smb_connect: ^0.0.9
  network_info_plus: ^4.1.0
  flutter_synckit: ^0.0.3

  # Lyrics & Metadata
  http: ^1.1.0

  # Audio Visualizer
  audify: ^1.1.0
  audio_flux: ^1.2.2
  flutter_soloud: ^3.0.0
  flutter_recorder: any

  # UI & Animation
  lottie: ^3.0.0
  flutter_animate: ^4.3.0
  phosphor_flutter: ^2.0.0

  # Utils
  path: ^1.9.0
  uuid: ^4.2.2
  collection: ^1.18.0
  crypto: ^3.0.3

  # JavaScript Engine (for custom music sources)
  flutter_js: ^0.8.7
  equatable: ^2.0.5
  intl: ^0.19.0
  google_fonts: ^6.1.0

  # Netease Music API
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.2
  mobile_scanner: ^5.1.1
  share_plus: ^12.0.2

  # TV Support
  wakelock_plus: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  custom_lint: ^0.5.7

flutter:
  uses-material-design: true

  assets:
    - assets/test_source.js
    - assets/changqing.js
    - assets/sixyin.js
    - assets/leaderboard_test.js
    - assets/all_board_source.js
    - lib/features/tv/config/

  # SF Pro Display 字体已移除（代码中未引用，14.5MB）
  # 如需使用可重新添加