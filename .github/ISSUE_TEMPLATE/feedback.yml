name: 问题反馈
description: 报告使用吾爱Music 时遇到的问题
title: "【反馈】"
labels: ["反馈"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！App 内「关于 → 问题反馈」会自动带上版本与系统信息；
        在这里直接提交的话，麻烦把下面几项填一下，定位会快很多。
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 简单说清楚遇到了什么
      placeholder: 例如：TV 版连续切 5 首之后，歌词高亮不再跟着走
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开电视端「本地音乐」
        2. 播放第一首
        3. …
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置 → 关于 里能看到，例如 1.3.3(40)
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: 渠道
      options:
        - 手机
        - HD / 车机 / 桌面
        - TV
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 例如 小米电视 ES43 / Android 11，或 Redmi K60 / Android 14
    validations:
      required: false
